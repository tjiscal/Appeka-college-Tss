     .slideshow {
      width: 90%;
      height: 400px;
      overflow: hidden;
      position: relative;
      margin: auto;
      border: 3px solid #333;
    }

    .slides {
      display: flex;
      width: 2400PX; /* 600px * 4 images */
      animation: slide 16s infinite;
    }

    .slides img {
      width: 600%;
      height: 400px;
    
    }

    @keyframes slide {
      0%    { transform: translateX(0); }
      20%   { transform: translateX(0); }
      25%   { transform: translateX(-600px); }
      45%   { transform: translateX(-600px); }
      50%   { transform: translateX(-1200px); }
      70%   { transform: translateX(-1200px); }
      75%   { transform: translateX(-1800px); }
      95%   { transform: translateX(-1800px); }
      100%  { transform: translateX(0); }
    }
    div{
      height: 10px;
      width: 100%;
    }
    a{
      position: absolute;
      bottom: 90%;
    }
    body{
